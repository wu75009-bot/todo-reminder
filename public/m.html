<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="theme-color" content="#f6f7f9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#17181c" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="待办">
<title>待办提醒</title>
<style>
  :root {
    --bg: #f6f7f9;
    --card: #ffffff;
    --text: #16181d;
    --muted: #6b7280;
    --line: #e5e7eb;
    --accent: #2563eb;
    --accent-text: #ffffff;
    --ok: #16a34a;
    --warn: #d97706;
    --danger: #dc2626;
    --shadow: 0 1px 2px rgba(16,24,40,.06), 0 4px 12px rgba(16,24,40,.05);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #17181c;
      --card: #202227;
      --text: #e9eaee;
      --muted: #9aa0ab;
      --line: #2e3138;
      --accent: #3b82f6;
      --accent-text: #ffffff;
      --ok: #4ade80;
      --warn: #fbbf24;
      --danger: #f87171;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 14px rgba(0,0,0,.25);
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Helvetica Neue", sans-serif;
    padding: env(safe-area-inset-top) 0 calc(env(safe-area-inset-bottom) + 12px);
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 560px; margin: 0 auto; padding: 0 16px; }

  header { padding: 18px 0 10px; display: flex; align-items: baseline; gap: 10px; }
  header h1 { font-size: 20px; font-weight: 650; margin: 0; letter-spacing: .2px; }
  header .sub { font-size: 13px; color: var(--muted); }

  .composer {
    background: var(--card);
    border-radius: 16px;
    box-shadow: var(--shadow);
    padding: 4px;
    margin-bottom: 14px;
  }
  textarea {
    width: 100%;
    border: 0;
    background: transparent;
    color: var(--text);
    font: inherit;
    font-size: 17px;
    line-height: 1.55;
    padding: 14px 14px 8px;
    resize: none;
    outline: none;
    min-height: 76px;
    max-height: 40vh;
  }
  textarea::placeholder { color: var(--muted); opacity: .85; }
  .bar { display: flex; gap: 8px; align-items: center; padding: 0 10px 10px; }
  .bar .hint { flex: 1; font-size: 12px; color: var(--muted); }
  /* 窄屏上提示语会把按钮挤出去，直接藏掉 —— 它只是新手引导，不是必需信息 */
  @media (max-width: 360px) { .bar .hint { display: none; } }
  button {
    font: inherit; font-size: 16px; font-weight: 600;
    border: 0; border-radius: 12px; cursor: pointer;
    padding: 12px 20px; min-height: 46px;
    background: var(--accent); color: var(--accent-text);
    transition: opacity .15s, transform .08s;
  }
  button:active { transform: scale(.97); }
  button[disabled] { opacity: .5; }
  button.ghost {
    background: transparent; color: var(--muted);
    border: 1px solid var(--line); padding: 11px 14px; font-weight: 500;
  }
  /* 拍照/相册：小方块，不抢「记下」的位置 */
  .bar .snap {
    background: transparent; color: var(--text);
    border: 1px solid var(--line); border-radius: 11px;
    padding: 0; width: 44px; min-height: 40px;
    font-size: 19px; line-height: 1; font-weight: 400;
    display: flex; align-items: center; justify-content: center;
  }
  .bar .snap:active { background: color-mix(in srgb, var(--accent) 10%, transparent); }

  .result {
    display: none;
    background: var(--card);
    border-radius: 14px;
    box-shadow: var(--shadow);
    padding: 14px 16px;
    margin-bottom: 14px;
    border-left: 3px solid var(--ok);
  }
  .result.show { display: block; animation: pop .18s ease-out; }
  .result.error { border-left-color: var(--danger); }
  .result h3 { margin: 0 0 6px; font-size: 15px; font-weight: 650; }
  .result .sub { font-size: 13px; color: var(--muted); margin: 10px 0 2px; }
  .result ul { margin: 8px 0 0; padding: 0; list-style: none; }
  .result li {
    font-size: 14px; color: var(--muted);
    padding: 4px 0 4px 18px; position: relative;
  }
  .result li::before {
    content: ""; position: absolute; left: 4px; top: 12px;
    width: 6px; height: 6px; border-radius: 50%; background: var(--accent);
  }
  .result li .w { color: var(--text); font-variant-numeric: tabular-nums; }
  @keyframes pop { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: none; } }

  .section { margin-top: 22px; }
  .section > .head {
    display: flex; align-items: center; justify-content: space-between;
    margin: 0 2px 10px;
  }
  .section > .head h2 { font-size: 13px; font-weight: 600; color: var(--muted); margin: 0; letter-spacing: .4px; text-transform: uppercase; }
  .section > .head .count { font-size: 13px; color: var(--muted); }

  .task {
    background: var(--card);
    border-radius: 14px;
    box-shadow: var(--shadow);
    padding: 14px 16px;
    margin-bottom: 10px;
  }
  .task .t { font-size: 16px; font-weight: 550; word-break: break-word; }
  .task .meta { font-size: 13px; color: var(--muted); margin-top: 4px; font-variant-numeric: tabular-nums; }
  .task .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .chip {
    font-size: 12.5px; padding: 4px 9px; border-radius: 999px;
    background: color-mix(in srgb, var(--accent) 12%, transparent);
    color: var(--accent); font-variant-numeric: tabular-nums;
  }
  .chip.past { background: color-mix(in srgb, var(--muted) 14%, transparent); color: var(--muted); text-decoration: line-through; }
  .task .actions { display: flex; gap: 8px; margin-top: 12px; }
  .task .actions button { font-size: 13.5px; padding: 8px 14px; min-height: 36px; border-radius: 9px; }
  .task .actions .done { background: color-mix(in srgb, var(--ok) 14%, transparent); color: var(--ok); }
  .task .actions .del { background: color-mix(in srgb, var(--danger) 12%, transparent); color: var(--danger); }

  /* 过期的不删，但压下去：留着是为了「我是不是忘了什么」这种自查 */
  .task.expired { opacity: .52; }
  .task.expired .t { text-decoration: line-through; text-decoration-color: color-mix(in srgb, var(--muted) 60%, transparent); }
  .gone-head {
    font-size: 12.5px; color: var(--muted);
    margin: 20px 2px 8px; letter-spacing: .3px;
  }

  .empty { color: var(--muted); font-size: 14px; text-align: center; padding: 26px 0; }

  /* 已完成：收起来是一行标题，展开才占地方 */
  .done-head { cursor: pointer; -webkit-user-select: none; user-select: none; }
  .done-head .caret {
    display: inline-block; font-size: 11px; margin-right: 2px;
    color: var(--muted); transition: transform .15s;
  }
  .done-head.open .caret { transform: rotate(90deg); }
  .task.done { opacity: .62; }
  .task.done .t { color: var(--muted); }
  .task .actions .undo {
    background: color-mix(in srgb, var(--accent) 12%, transparent);
    color: var(--accent);
  }

  footer { margin-top: 26px; font-size: 12px; color: var(--muted); text-align: center; line-height: 1.8; }
  footer a { color: var(--muted); }
  footer .tip { margin-top: 14px; padding: 8px 12px; border: 1px dashed var(--line); border-radius: 10px; }
  footer .tip[hidden] { display: none; }

  /* ---------- 提醒时间面板 ---------- */
  /* 卡片上一个「改时间」，点开从底部升起来。
     列表里就是这条任务现在所有的提醒点，删一个少一个，加一个多一个。 */
  .task .actions button.edit {
    background: color-mix(in srgb, var(--accent) 10%, transparent);
    color: var(--accent);
  }
  .task .actions button { flex: 1; min-width: 0; }

  .sheet { position: fixed; inset: 0; z-index: 60; display: flex; align-items: flex-end; }
  .sheet[hidden] { display: none; }
  .sheet-mask { position: absolute; inset: 0; background: rgba(0, 0, 0, .4); }
  .sheet-body {
    position: relative; width: 100%;
    background: var(--bg);
    border-radius: 18px 18px 0 0;
    padding: 16px 18px calc(16px + env(safe-area-inset-bottom));
    max-height: 88vh; overflow-y: auto;
    box-shadow: 0 -10px 30px rgba(0, 0, 0, .22);
    animation: slideup .2s cubic-bezier(.22, .61, .36, 1);
  }
  @keyframes slideup { from { transform: translateY(100%); } to { transform: none; } }
  .sheet-body h3 { margin: 0; font-size: 16px; font-weight: 650; }
  .sheet-body .who {
    font-size: 13px; color: var(--muted); margin: 4px 0 14px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }

  .plist { display: flex; flex-direction: column; gap: 8px; margin-bottom: 12px; }
  .plist .none { font-size: 13.5px; color: var(--muted); padding: 10px 0; text-align: center; }
  .prow {
    display: flex; align-items: center; gap: 10px;
    background: var(--card); border-radius: 11px;
    padding: 11px 10px 11px 14px; box-shadow: var(--shadow);
  }
  .prow .when { flex: 1; font-size: 14.5px; font-variant-numeric: tabular-nums; }
  .prow .when small { display: block; font-size: 11.5px; color: var(--muted); margin-top: 1px; }
  .prow .x {
    width: 32px; height: 32px; padding: 0; border-radius: 8px; font-size: 17px;
    background: color-mix(in srgb, var(--danger) 10%, transparent);
    color: var(--danger); display: flex; align-items: center; justify-content: center;
  }

  .pquick { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
  .pquick button {
    font-size: 13px; padding: 8px 12px; border-radius: 999px; min-height: 34px;
    background: var(--card); color: var(--text); box-shadow: var(--shadow);
  }
  .padd { display: flex; gap: 8px; margin-bottom: 6px; }
  .padd input[type="datetime-local"] {
    flex: 1; min-width: 0; font-size: 15px; font-family: inherit;
    padding: 10px 12px; border-radius: 11px;
    border: 1px solid var(--line); background: var(--card); color: var(--text);
    -webkit-appearance: none; appearance: none;
  }
  .padd button { padding: 0 16px; min-height: 44px; border-radius: 11px; }

  .sheet-actions { display: flex; gap: 10px; margin-top: 14px; }
  .sheet-actions button { flex: 1; min-height: 46px; border-radius: 12px; font-size: 15px; }
  .sheet-actions .auto { background: transparent; color: var(--muted); border: 1px solid var(--line); }
  .sheet-actions .auto[disabled] { opacity: .4; }

  .toast {
    position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom) + 22px);
    transform: translate(-50%, 12px);
    background: #16181d; color: #fff;
    padding: 11px 18px; border-radius: 12px;
    font-size: 14px; opacity: 0; pointer-events: none;
    transition: opacity .2s, transform .2s;
    max-width: 86vw; text-align: center; z-index: 99;
  }
  .toast.show { opacity: .96; transform: translate(-50%, 0); }
  @media (prefers-color-scheme: dark) {
    .toast { background: #3a3d45; }
  }

  .locked { padding: 60px 20px; text-align: center; color: var(--muted); }
  .locked h2 { color: var(--text); font-size: 18px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>待办</h1>
    <span class="sub" id="sub">—</span>
  </header>

  <div id="app" hidden>
    <div class="composer">
      <textarea id="input" rows="2" placeholder="想到什么就写下来，比如「周五下午三点交实验报告」" enterkeyhint="send"></textarea>
      <div class="bar">
        <button class="snap" id="btnCam" aria-label="拍照记" title="拍一张">📷</button>
        <button class="snap" id="btnGal" aria-label="从相册选" title="从相册选">🖼</button>
        <span class="hint">时间、地点、要带什么都可以一起说</span>
        <button id="send">记下</button>
      </div>
      <input type="file" id="fileCam" accept="image/*" capture="environment" hidden>
      <input type="file" id="fileGal" accept="image/*" hidden>
    </div>

    <div class="result" id="result"></div>

    <div class="section">
      <div class="head">
        <h2>接下来</h2>
        <span class="count" id="count"></span>
      </div>
      <div id="tasks"><div class="empty">还没有待办</div></div>
    </div>

    <!-- 点完成不该等于消失。默认收起来，免得占着一屏，但一眼能看到有几条 -->
    <div class="section" id="doneSection" hidden>
      <div class="head done-head" id="doneHead">
        <h2><span class="caret">▸</span> 已完成</h2>
        <span class="count" id="doneCount"></span>
      </div>
      <div id="doneBox" hidden></div>
    </div>

    <footer>
      提醒会发到邮箱<br>
      <a href="#" id="icsLink">同步到手机日历</a>
      <div class="tip" id="tip">把这页加到主屏幕，下次点图标就能直接记，不用再找链接</div>
    </footer>
  </div>

  <div class="locked" id="locked" hidden>
    <h2>链接无效</h2>
    <p>这个页面需要带密钥的链接才能打开。<br>找我要一条新的。</p>
  </div>
</div>

<div class="toast" id="toast"></div>

<!-- 改提醒时间：列出现在所有的点，删/加，点保存一次性提交。
     原来的固定提醒默认都在列表里，不动它就还是原来的时间。 -->
<div class="sheet" id="sheet" hidden>
  <div class="sheet-mask" data-close="1"></div>
  <div class="sheet-body">
    <h3>什么时候提醒你</h3>
    <div class="who" id="sheetWho"></div>
    <div class="plist" id="plist"></div>
    <div class="pquick" id="pquick"></div>
    <div class="padd">
      <input type="datetime-local" id="pinput">
      <button id="paddBtn">加</button>
    </div>
    <div class="sheet-actions">
      <button class="auto" id="pAuto">按规则自动排</button>
      <button id="pSave">保存</button>
    </div>
  </div>
</div>

<script>
(function () {
  const KEY = "todo_token";
  const $ = id => document.getElementById(id);

  // token 优先从地址栏取一次，之后存本地并从地址栏抹掉（避免截图/转发时泄露）
  const qs = new URLSearchParams(location.search);
  let token = qs.get("t") || localStorage.getItem(KEY) || "";
  // x= 是预填内容（给"分享/转发"这类入口用），粘进去后立刻从地址栏抹掉
  const prefill = (qs.get("x") || "").slice(0, 500);
  if (qs.get("t") || qs.get("x")) {
    if (qs.get("t")) localStorage.setItem(KEY, qs.get("t"));
    history.replaceState(null, "", location.pathname);
  }

  function toast(msg) {
    const el = $("toast");
    el.textContent = msg;
    el.classList.add("show");
    clearTimeout(toast._t);
    toast._t = setTimeout(() => el.classList.remove("show"), 2200);
  }

  async function api(path, opts = {}) {
    const res = await fetch(path, {
      ...opts,
      headers: { "X-Todo-Token": token, ...(opts.body ? { "Content-Type": "application/json" } : {}) }
    });
    if (res.status === 401) { showLocked(); throw new Error("unauthorized"); }
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || ("HTTP " + res.status));
    return data;
  }

  function showLocked() {
    $("app").hidden = true;
    $("locked").hidden = false;
    $("sub").textContent = "";
  }

  // ---------- 时间显示 ----------
  const WD = ["周日","周一","周二","周三","周四","周五","周六"];
  function pad(n){ return String(n).padStart(2,"0"); }

  function dayLabel(d) {
    const now = new Date();
    const d0 = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    const t0 = new Date(d.getFullYear(), d.getMonth(), d.getDate());
    const diff = Math.round((t0 - d0) / 86400000);
    if (diff === 0) return "今天";
    if (diff === 1) return "明天";
    if (diff === 2) return "后天";
    if (diff > 2 && diff < 7) return WD[d.getDay()];
    return (d.getMonth() + 1) + "月" + d.getDate() + "日";
  }

  function timeLabel(ms) {
    const d = new Date(ms);
    return dayLabel(d) + " " + pad(d.getHours()) + ":" + pad(d.getMinutes());
  }

  // ---------- 渲染 ----------
  let state = null;

  function render() {
    if (!state) return;
    const all = state.tasks || [];
    const tasks = all.filter(t => !t.done);
    const now = Date.now();

    // 顶部副标题：今天几号
    const d = new Date();
    $("sub").textContent = (d.getMonth() + 1) + "月" + d.getDate() + "日 " + WD[d.getDay()];

    const box = $("tasks");
    if (!tasks.length) {
      $("count").textContent = "";
      box.innerHTML = '<div class="empty">还没有待办</div>';
      renderDone(all, now);
      return;
    }

    // 已经过去的任务不能混在「接下来」里：考完的考试还挂在最上面，
    // 一眼看过去会以为还有事没做。按时间分两堆，过期的沉底并变灰。
    const live = [], gone = [];
    for (const t of tasks) {
      const a = anchorOf(t);
      const hasFuture = (t.reminders || []).some(r => r.status === "pending" && Date.parse(r.fireAt) > now);
      if (Number.isFinite(a) && a < now && !hasFuture) gone.push(t);
      else live.push(t);
    }
    const byTime = (x, y) => {
      const a = anchorOf(x), b = anchorOf(y);
      return (Number.isFinite(a) ? a : Infinity) - (Number.isFinite(b) ? b : Infinity);
    };
    live.sort(byTime);
    gone.sort((x, y) => anchorOf(y) - anchorOf(x));

    $("count").textContent = live.length ? live.length + " 件" : "";

    let html = live.map(t => card(t, now)).join("");
    if (!live.length) html = '<div class="empty">没有进行中的事</div>';
    if (gone.length) {
      html += '<div class="gone-head">已过期 · ' + gone.length + '</div>'
        + gone.map(t => card(t, now, true)).join("");
    }
    box.innerHTML = html;
    renderDone(all, now);
  }

  // 完成的不是删掉：留着是想知道"这件事我确实做过了"，顺手点错也能捞回来。
  function renderDone(all, now) {
    const list = all.filter(t => t.done);
    const sec = $("doneSection");
    if (!list.length) { sec.hidden = true; return; }
    sec.hidden = false;
    $("doneCount").textContent = list.length + " 件";
    list.sort((a, b) => (b.doneAt || 0) - (a.doneAt || 0));
    $("doneBox").innerHTML = list.map(doneCard).join("");
    void now;
  }

  function doneCard(t) {
    const at = t.doneAt ? timeLabel(t.doneAt) + " 完成" : "已完成";
    return ''
      + '<div class="task done" data-id="' + t.id + '">'
      +   '<div class="t">' + esc(t.title || "(没写标题)") + "</div>"
      +   '<div class="meta">' + at + "</div>"
      +   '<div class="actions"><button class="undo" data-act="undo">恢复</button></div>'
      + "</div>";
  }

  function anchorOf(t) {
    const s = t.start || t.due;
    if (s) { const at = Date.parse(s); if (Number.isFinite(at)) return at; }
    // 没写时间（「作业发下来了」这类）就按第一个提醒点排，
    // 否则设好时间的任务还沉在列表最底下，等于白设。
    const first = (t.reminders || [])
      .filter(r => r.status === "pending")
      .map(r => Date.parse(r.fireAt))
      .filter(Number.isFinite)
      .sort((a, b) => a - b)[0];
    return Number.isFinite(first) ? first : NaN;
  }

  function card(t, now, expired) {
    const rs = (t.reminders || [])
      .filter(r => r.status === "pending")
      .sort((a, b) => Date.parse(a.fireAt) - Date.parse(b.fireAt));
    const chips = rs.map(r => {
      const at = Date.parse(r.fireAt);
      const past = at < now;
      return '<span class="chip' + (past ? " past" : "") + '">' + timeLabel(at) + "</span>";
    }).join("");
    // start 是「几点开始」，due 是「几点之前交完」。两种都要认，
    // 只认 start 会让所有「交作业/报名截止」这类任务在手机上不显示时间。
    // 注意这里只看任务自己的时间，不看提醒点：否则「20:00 提醒你」会被
    // 显示成「截止 20:00」，等于凭空造了个截止时间出来。
    const s = t.start || t.due;
    const a = s ? Date.parse(s) : NaN;
    const meta = Number.isFinite(a)
      ? "<div class=\"meta\">" + (t.start ? "" : "截止 ") + timeLabel(a) + "</div>"
      : "";
    return ''
      + '<div class="task' + (expired ? " expired" : "") + '" data-id="' + t.id + '">'
      +   '<div class="t">' + esc(t.title || "(没写标题)") + "</div>"
      +   meta
      +   (chips ? '<div class="chips">' + chips + "</div>" : "")
      +   '<div class="actions">'
      +     '<button class="done" data-act="done">完成了</button>'
      +     '<button class="edit" data-act="edit">改时间</button>'
      +     '<button class="del" data-act="drop">删掉</button>'
      +   "</div>"
      + "</div>";
  }

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, c => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
    }[c]));
  }

  function showResult(html, isError) {
    const el = $("result");
    el.className = "result show" + (isError ? " error" : "");
    el.innerHTML = html;
  }

  // ---------- 数据 ----------
  async function refresh() {
    try {
      state = await api("/api/state");
      render();
    } catch (e) {
      if (e.message !== "unauthorized") toast("读取失败：" + e.message);
    }
  }

  async function addTask() {
    const ta = $("input");
    const text = ta.value.trim();
    if (!text) { ta.focus(); return; }

    const btn = $("send");
    btn.disabled = true;
    btn.textContent = "识别中";
    try {
      const r = await api("/api/add", {
        method: "POST",
        body: JSON.stringify({ text, source: "手机" })
      });
      ta.value = "";
      autosize();
      try { localStorage.setItem("tip_done", "1"); $("tip").hidden = true; } catch {}

      await refresh();
      renderAdded(r.task || {}, r.notes || []);
    } catch (e) {
      if (e.message !== "unauthorized") showResult("<h3>没记上</h3><p style=\"font-size:14px;margin:6px 0 0\">" + esc(e.message) + "</p>", true);
    } finally {
      btn.disabled = false;
      btn.textContent = "记下";
    }
  }

  // 「记下了」这张卡片：先说标题，再拿刚拉回来的真实提醒时间重画一遍。
  // 用服务端排出来的时间而不是我们猜的 —— 中间可能被规则改过。
  function renderAdded(t, notes) {
    void notes;
    const title = "记下了：" + esc(t.title || "新任务");
    const found = (state && state.tasks || []).find(x => x.id === t.id);
    const fresh = ((found && found.reminders) || [])
      .filter(x => x.status === "pending")
      .sort((a, b) => a.fireAt - b.fireAt);
    if (fresh.length) {
      showResult(
        "<h3>" + title + "</h3>"
        + '<div class="sub">会在这些时候提醒你</div>'
        + "<ul>" + fresh.map(x => '<li><span class="w">' + timeLabel(x.fireAt) + "</span></li>").join("") + "</ul>",
        false
      );
      return;
    }
    if (t.start || t.due) {
      const a = Date.parse(t.start || t.due);
      showResult("<h3>" + title + "</h3><p style=\"font-size:14px;color:var(--muted);margin:6px 0 0\">"
        + timeLabel(a) + "，但没排上提醒点，我看一下规则再说。</p>", false);
      return;
    }
    showResult("<h3>" + title + "</h3><p style=\"font-size:14px;color:var(--muted);margin:6px 0 0\">没识别到时间，所以不会提醒。</p>", false);
  }

  // ---------- 拍照 ----------
  // 手机直出照片三五兆，走 4G 传上去又慢又容易超限。先等比压到 1600px，
  // 通知类截图上的字照样认得出，体积能小一个数量级。
  function shrink(file) {
    return new Promise((resolve, reject) => {
      const url = URL.createObjectURL(file);
      const img = new Image();
      img.onload = () => {
        try {
          const max = 1600;
          const scale = Math.min(1, max / Math.max(img.width, img.height));
          const w = Math.round(img.width * scale), h = Math.round(img.height * scale);
          const cv = document.createElement("canvas");
          cv.width = w; cv.height = h;
          cv.getContext("2d").drawImage(img, 0, 0, w, h);
          resolve(cv.toDataURL("image/jpeg", 0.85));
        } catch (e) {
          reject(e);
        } finally {
          URL.revokeObjectURL(url);
        }
      };
      img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("这张图打不开，换一张试试")); };
      img.src = url;
    });
  }

  async function takePhoto(file) {
    if (!file) return;
    $("btnCam").disabled = $("btnGal").disabled = true;
    showResult("<h3>正在看图…</h3><p style=\"font-size:14px;color:var(--muted);margin:6px 0 0\">图上字多的话会慢一点</p>", false);
    try {
      const dataUrl = await shrink(file);
      const r = await api("/api/photo", { method: "POST", body: JSON.stringify({ dataUrl }) });
      if (!r.ok) {
        showResult("<h3>没认出来</h3><p style=\"font-size:14px;margin:6px 0 0\">" + esc(r.error || "识别失败") + "</p>", true);
        return;
      }
      try { localStorage.setItem("tip_done", "1"); $("tip").hidden = true; } catch {}
      await refresh();
      renderAdded(r.task || {}, r.notes || []);
    } catch (e) {
      if (e.message !== "unauthorized") showResult("<h3>没认出来</h3><p style=\"font-size:14px;margin:6px 0 0\">" + esc(e.message) + "</p>", true);
    } finally {
      $("btnCam").disabled = $("btnGal").disabled = false;
      $("fileCam").value = $("fileGal").value = "";
    }
  }

  async function act(id, what) {
    try {
      const r = await api("/api/mobile/" + what, { method: "POST", body: JSON.stringify({ id }) });
      toast(what === "done" ? "已标记完成，在下面「已完成」里"
        : what === "undo" ? (r.restored ? "恢复了，重新排上 " + r.restored + " 个提醒" : "恢复了")
        : "已删除");
      await refresh();
    } catch (e) {
      if (e.message !== "unauthorized") toast("操作失败：" + e.message);
    }
  }

  // ---------- 改提醒时间 ----------
  // draft 是「我最终想要的那几个时刻」。打开面板时把现有的点全部灌进来，
  // 所以什么都不动就保存 = 原样保留，原有的固定提醒一个都不会丢。
  let sheetId = "";
  let draft = [];

  function dtValue(ms) {
    const d = new Date(ms);
    return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate())
      + "T" + pad(d.getHours()) + ":" + pad(d.getMinutes());
  }

  function longLabel(ms) {
    const d = new Date(ms);
    return (d.getMonth() + 1) + "月" + d.getDate() + "日 " + WD[d.getDay()];
  }

  // 常用的几个点。只给还没到的，省得点了一下又提示「已经过去了」。
  function quickPicks() {
    const now = new Date();
    const at = (base, h, m) => new Date(base.getFullYear(), base.getMonth(), base.getDate(), h, m).getTime();
    const d1 = new Date(now.getTime() + 86400000);
    const d2 = new Date(now.getTime() + 2 * 86400000);
    const out = [];
    const push = (ms, label) => { if (ms > Date.now() + 60000) out.push({ ms, label }); };
    push(at(now, 20, 0), "今晚 20:00");
    push(at(d1, 8, 0), "明早 8:00");
    push(at(d1, 12, 0), "明天中午");
    push(at(d1, 20, 0), "明晚 20:00");
    push(at(d2, 20, 0), "后天 20:00");
    return out;
  }

  function openSheet(task) {
    sheetId = task.id;
    const now = Date.now();
    draft = [...new Set(
      (task.reminders || [])
        .filter(r => r.status === "pending" && Date.parse(r.fireAt) > now - 60000)
        .map(r => Date.parse(r.fireAt))
    )].sort((a, b) => a - b);

    $("sheetWho").textContent = task.title || "(没写标题)";
    // 没有规则的任务点「按规则自动排」等于清空，这个按钮别给
    $("pAuto").hidden = !task.ruleFile;
    // 输入框预填「明天 20:00」：作业、通知类的提醒多半落在这个点，
    // 比按当前时间 +1 小时（凌晨一点）有用得多。
    const d1 = new Date(now + 86400000);
    $("pinput").value = dtValue(new Date(d1.getFullYear(), d1.getMonth(), d1.getDate(), 20, 0).getTime());
    renderDraft();
    $("sheet").hidden = false;
    document.body.style.overflow = "hidden";
  }

  function closeSheet() {
    $("sheet").hidden = true;
    document.body.style.overflow = "";
  }

  function renderDraft() {
    $("plist").innerHTML = draft.length
      ? draft.map((ms, i) =>
          '<div class="prow">'
          + '<div class="when">' + timeLabel(ms) + "<small>" + longLabel(ms) + "</small></div>"
          + '<button class="x" data-i="' + i + '" aria-label="删掉这个时间">×</button>'
          + "</div>").join("")
      : '<div class="none">这条还没有提醒时间，下面加一个</div>';

    const q = quickPicks().filter(x => !draft.includes(x.ms));
    $("pquick").innerHTML = q.map(x =>
      '<button data-ms="' + x.ms + '">' + x.label + "</button>").join("");
  }

  function addPoint(ms) {
    if (!Number.isFinite(ms)) return;
    if (ms <= Date.now()) { toast("这个时间已经过去了"); return; }
    if (draft.includes(ms)) { toast("这个时间已经加过了"); return; }
    draft.push(ms);
    draft.sort((a, b) => a - b);
    renderDraft();
  }

  async function saveDraft() {
    const btn = $("pSave");
    btn.disabled = true;
    btn.textContent = "保存中";
    try {
      await api("/api/mobile/reminders", {
        method: "POST",
        body: JSON.stringify({ id: sheetId, points: draft.map(ms => new Date(ms).toISOString()) })
      });
      const n = draft.length;
      closeSheet();
      await refresh();
      toast(n ? "改好了，会在这些时候叫你" : "提醒都清掉了，这条不会再叫你");
    } catch (e) {
      if (e.message !== "unauthorized") toast("没保存上：" + e.message);
    } finally {
      btn.disabled = false;
      btn.textContent = "保存";
    }
  }

  async function restoreAuto() {
    const btn = $("pAuto");
    btn.disabled = true;
    try {
      const r = await api("/api/mobile/reminders", {
        method: "POST",
        body: JSON.stringify({ id: sheetId, mode: "auto" })
      });
      closeSheet();
      await refresh();
      toast("已按规则重排，" + (r.reminders || []).length + " 个提醒");
    } catch (e) {
      if (e.message !== "unauthorized") toast("没改成：" + e.message);
    } finally {
      btn.disabled = false;
    }
  }

  function autosize() {
    const ta = $("input");
    ta.style.height = "auto";
    ta.style.height = Math.min(ta.scrollHeight, Math.round(window.innerHeight * 0.4)) + "px";
  }

  // ---------- 事件 ----------
  $("send").addEventListener("click", addTask);
  $("btnCam").addEventListener("click", () => $("fileCam").click());
  $("btnGal").addEventListener("click", () => $("fileGal").click());
  $("fileCam").addEventListener("change", e => takePhoto(e.target.files[0]));
  $("fileGal").addEventListener("change", e => takePhoto(e.target.files[0]));
  $("input").addEventListener("input", autosize);
  $("input").addEventListener("keydown", e => {
    // 桌面调试用；手机上回车是换行
    if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) { e.preventDefault(); addTask(); }
  });
  const onCardTap = e => {
    const btn = e.target.closest("button[data-act]");
    if (!btn) return;
    const id = btn.closest(".task").dataset.id;
    if (btn.dataset.act === "edit") {
      const t = ((state && state.tasks) || []).find(x => x.id === id);
      if (t) openSheet(t);
      return;
    }
    act(id, btn.dataset.act);
  };
  $("tasks").addEventListener("click", onCardTap);
  $("doneBox").addEventListener("click", onCardTap);
  $("doneHead").addEventListener("click", () => {
    const box = $("doneBox");
    box.hidden = !box.hidden;
    $("doneHead").classList.toggle("open", !box.hidden);
  });
  $("icsLink").addEventListener("click", e => {
    e.preventDefault();
    // 在 App 里：让它直接往系统日历写事件（手机浏览器那条 .ics 基本没人认）
    if (window.TodoApp && typeof window.TodoApp.syncCalendar === "function") {
      window.TodoApp.syncCalendar();
      toast("正在写进手机日历…");
      return;
    }
    location.href = "/api/calendar.ics?days=60&t=" + encodeURIComponent(token);
  });

  // 时间面板
  $("plist").addEventListener("click", e => {
    const b = e.target.closest("button[data-i]");
    if (!b) return;
    draft.splice(Number(b.dataset.i), 1);
    renderDraft();
  });
  $("pquick").addEventListener("click", e => {
    const b = e.target.closest("button[data-ms]");
    if (b) addPoint(Number(b.dataset.ms));
  });
  $("paddBtn").addEventListener("click", () => {
    const v = $("pinput").value;
    if (!v) { toast("先选个时间"); return; }
    addPoint(new Date(v).getTime());
  });
  $("pSave").addEventListener("click", saveDraft);
  $("pAuto").addEventListener("click", restoreAuto);
  $("sheet").addEventListener("click", e => {
    if (e.target.dataset.close) closeSheet();
  });
  document.addEventListener("keydown", e => {
    if (e.key === "Escape" && !$("sheet").hidden) closeSheet();
  });

  // ---------- 启动 ----------
  if (!token) { showLocked(); return; }
  $("app").hidden = false;
  if (prefill) $("input").value = prefill;
  autosize();
  refresh();
  setInterval(refresh, 60000);
  try { if (localStorage.getItem("tip_done")) $("tip").hidden = true; } catch {}
  // 打开就直接能打，不用再点一下输入框
  if (!prefill) setTimeout(() => { try { $("input").focus(); } catch {} }, 280);
  // 从后台回来时立刻刷新一次
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "visible") refresh();
  });
})();
</script>
</body>
</html>
